# Contoh konfigurasi Nginx untuk VPS (Ubuntu + PHP 8.4-FPM).
# Salin ke /etc/nginx/sites-available/izin-kerja-khusus, sesuaikan server_name dan path,
# lalu: ln -s ../sites-available/izin-kerja-khusus /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
server {
    listen 80;
    server_name ikk.contoh.id;
    root /var/www/izin-kerja-khusus/public;
    index index.php;

    # Dokumen unggahan maksimal 10 MB per berkas, 3 berkas sekaligus.
    client_max_body_size 32M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 30d;
        access_log off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
