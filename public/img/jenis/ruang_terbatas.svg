<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Animasi pekerja di ruang terbatas dengan ventilasi dan detektor gas">
  <style>
    .kipas { transform-origin: 470px 70px; animation: putar .8s linear infinite; }
    @keyframes putar { to { transform: rotate(360deg); } }
    .udara path { stroke-dasharray: 14 12; animation: alir 1s linear infinite; }
    @keyframes alir { to { stroke-dashoffset: -26; } }
    .lampu { animation: kedip 1.4s ease-in-out infinite; }
    @keyframes kedip { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
    .sorot { animation: sorot 5s ease-in-out infinite; transform-origin: 250px 205px; }
    @keyframes sorot { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
    .jaga { transform-origin: 170px 90px; animation: angguk 3s ease-in-out infinite; }
    @keyframes angguk { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(6deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="640" height="360" fill="#e2e8f0"/>
  <rect y="110" width="640" height="250" fill="#cbd5e1"/>
  <!-- tangki (potongan) -->
  <rect x="60" y="130" width="520" height="210" rx="100" fill="#475569"/>
  <rect x="76" y="146" width="488" height="178" rx="88" fill="#1f2937"/>
  <!-- lubang masuk (manhole) -->
  <rect x="200" y="100" width="100" height="46" fill="#475569"/>
  <rect x="214" y="100" width="72" height="46" fill="#111827"/>
  <!-- sorot lampu helm -->
  <path class="sorot" d="M250 205 L420 170 L420 250 Z" fill="#fde68a" opacity=".35"/>
  <!-- pekerja di dalam -->
  <g>
    <circle cx="236" cy="206" r="14" fill="#f1c27d"/>
    <path d="M220 202 a16 14 0 0 1 32 0 z" fill="#f97316"/>
    <circle cx="250" cy="200" r="4" fill="#fef08a"/>
    <rect x="220" y="220" width="32" height="44" rx="7" fill="#eab308"/>
    <path d="M220 226 l32 30 M252 226 l-32 30" stroke="#1e293b" stroke-width="4"/>
    <rect x="222" y="262" width="11" height="40" rx="3" fill="#1e3a8a"/><rect x="239" y="262" width="11" height="40" rx="3" fill="#1e3a8a"/>
    <!-- tali penyelamat ke luar -->
    <path d="M236 222 C236 170 250 140 250 80" stroke="#ea580c" stroke-width="3" fill="none"/>
  </g>
  <!-- detektor gas -->
  <g>
    <rect x="276" y="236" width="30" height="44" rx="5" fill="#facc15" stroke="#111827" stroke-width="2"/>
    <rect x="281" y="243" width="20" height="14" rx="2" fill="#064e3b"/>
    <text x="291" y="254" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4ade80">20.9</text>
    <circle class="lampu" cx="291" cy="268" r="5" fill="#22c55e"/>
  </g>
  <!-- blower ventilasi di luar -->
  <rect x="430" y="40" width="80" height="60" rx="8" fill="#2563eb"/>
  <circle cx="470" cy="70" r="24" fill="#1e3a8a"/>
  <g class="kipas" fill="#bfdbfe">
    <path d="M470 70 L470 48 A10 10 0 0 1 482 60 Z"/>
    <path d="M470 70 L492 70 A10 10 0 0 1 480 82 Z"/>
    <path d="M470 70 L470 92 A10 10 0 0 1 458 80 Z"/>
    <path d="M470 70 L448 70 A10 10 0 0 1 460 58 Z"/>
  </g>
  <circle cx="470" cy="70" r="5" fill="#0f172a"/>
  <!-- selang ventilasi -->
  <path d="M430 80 C340 80 272 78 272 112 L272 196" stroke="#94a3b8" stroke-width="14" fill="none" stroke-linecap="round"/>
  <g class="udara" stroke="#7dd3fc" stroke-width="3" fill="none">
    <path d="M280 204 C330 210 360 230 400 228"/>
    <path d="M280 214 C330 230 360 260 410 258"/>
    <path d="M280 196 C340 190 380 200 430 196"/>
  </g>
  <!-- petugas jaga (attendant) di luar -->
  <g class="jaga">
    <circle cx="170" cy="62" r="13" fill="#c68642"/>
    <path d="M155 58 a15 13 0 0 1 30 0 z" fill="#fff"/>
    <rect x="156" y="76" width="28" height="36" rx="6" fill="#f97316"/>
    <rect x="156" y="86" width="28" height="4" fill="#e5e7eb"/>
    <rect x="182" y="84" width="22" height="7" rx="3" fill="#f97316"/>
    <rect x="200" y="78" width="8" height="16" rx="2" fill="#111827"/>
  </g>
  <rect x="140" y="112" width="80" height="6" fill="#94a3b8"/>
</svg>
