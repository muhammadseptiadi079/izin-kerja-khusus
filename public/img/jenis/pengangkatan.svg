<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Animasi crane mengangkat beban lebih dari 1 ton">
  <style>
    .angkat { animation: angkat 6s ease-in-out infinite; }
    @keyframes angkat { 0%, 15% { transform: translateY(0); } 50%, 65% { transform: translateY(-110px); } 100% { transform: translateY(0); } }
    .kabel { transform-origin: 470px 70px; animation: kabel 6s ease-in-out infinite; }
    @keyframes kabel { 0%, 15% { transform: scaleY(1); } 50%, 65% { transform: scaleY(.45); } 100% { transform: scaleY(1); } }
    .goyang { transform-origin: 470px 250px; animation: goyang 3s ease-in-out infinite; }
    @keyframes goyang { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
    .aba { transform-origin: 108px 250px; animation: aba 1s ease-in-out infinite; }
    @keyframes aba { 0%, 100% { transform: rotate(-20deg); } 50% { transform: rotate(20deg); } }
    .awan { animation: geser 22s linear infinite; }
    @keyframes geser { from { transform: translateX(-150px); } to { transform: translateX(700px); } }
    .suar { animation: suar 1s steps(1) infinite; }
    @keyframes suar { 50% { fill: #7c2d12; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs><linearGradient id="langit3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#dbeafe"/></linearGradient></defs>
  <rect width="640" height="360" fill="url(#langit3)"/>
  <g class="awan" fill="#fff" opacity=".9"><ellipse cx="80" cy="50" rx="44" ry="15"/><ellipse cx="108" cy="40" rx="28" ry="15"/></g>
  <path d="M0 250 Q160 225 320 245 T640 235 V360 H0Z" fill="#c08a52"/>
  <rect y="290" width="640" height="70" fill="#9ca3af"/>
  <!-- crane -->
  <rect x="150" y="262" width="150" height="34" rx="6" fill="#dc2626"/>
  <g fill="#1f2937"><circle cx="172" cy="300" r="14"/><circle cx="210" cy="300" r="14"/><circle cx="248" cy="300" r="14"/><circle cx="280" cy="300" r="14"/></g>
  <rect x="150" y="286" width="16" height="30" fill="#fbbf24"/><rect x="284" y="286" width="16" height="30" fill="#fbbf24"/>
  <rect x="190" y="228" width="60" height="36" rx="4" fill="#dc2626"/>
  <rect x="198" y="234" width="24" height="18" fill="#bfdbfe"/>
  <rect class="suar" x="236" y="222" width="8" height="8" rx="2" fill="#f97316"/>
  <!-- boom -->
  <path d="M230 236 L480 64" stroke="#f1f5f9" stroke-width="18" stroke-linecap="round"/>
  <path d="M230 236 L480 64" stroke="#dc2626" stroke-width="8" stroke-dasharray="20 14"/>
  <circle cx="472" cy="68" r="9" fill="#111827"/>
  <!-- kabel dan beban -->
  <line class="kabel" x1="470" y1="70" x2="470" y2="226" stroke="#111827" stroke-width="3"/>
  <g class="angkat">
    <g class="goyang">
      <path d="M462 226 h16 l-4 14 h-8 z" fill="#facc15" stroke="#111827" stroke-width="2"/>
      <path d="M470 240 L430 262 M470 240 L510 262" stroke="#111827" stroke-width="2.5"/>
      <rect x="420" y="262" width="100" height="44" rx="4" fill="#475569"/>
      <rect x="420" y="262" width="100" height="10" fill="#334155"/>
      <text x="470" y="294" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="#facc15">5 TON</text>
      <line x1="520" y1="290" x2="560" y2="330" stroke="#f97316" stroke-width="2" stroke-dasharray="4 3"/>
    </g>
  </g>
  <!-- barikade radius ayun -->
  <g fill="#ef4444"><rect x="360" y="304" width="5" height="26"/><rect x="600" y="304" width="5" height="26"/></g>
  <rect x="360" y="310" width="245" height="6" fill="#facc15"/>
  <!-- rigger memberi aba-aba -->
  <g>
    <circle cx="100" cy="226" r="11" fill="#c68642"/>
    <path d="M87 222 a13 11 0 0 1 26 0 z" fill="#facc15"/>
    <rect x="88" y="238" width="24" height="34" rx="5" fill="#f97316"/>
    <rect x="88" y="248" width="24" height="4" fill="#fde047"/>
    <rect x="90" y="272" width="9" height="24" fill="#1e3a8a"/><rect x="101" y="272" width="9" height="24" fill="#1e3a8a"/>
    <g class="aba"><rect x="106" y="246" width="30" height="7" rx="3" fill="#f97316"/><rect x="134" y="236" width="4" height="22" fill="#111827"/><rect x="138" y="236" width="16" height="11" fill="#dc2626"/></g>
  </g>
</svg>
