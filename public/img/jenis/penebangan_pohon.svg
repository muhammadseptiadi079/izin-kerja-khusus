<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Animasi penebangan pohon dengan chainsaw dan zona aman">
  <style>
    .pohon { transform-origin: 400px 282px; animation: rebah 7s ease-in infinite; }
    @keyframes rebah { 0%, 30% { transform: rotate(0); opacity: 1; } 70%, 84% { transform: rotate(78deg); opacity: 1; } 88% { transform: rotate(78deg); opacity: 0; } 89% { transform: rotate(0); opacity: 0; } 100% { transform: rotate(0); opacity: 1; } }
    .gergaji { animation: getar .08s linear infinite alternate; }
    @keyframes getar { to { transform: translate(1.5px, -1px); } }
    .serbuk circle { animation: serbuk .7s ease-out infinite; }
    @keyframes serbuk { from { transform: translate(0,0); opacity: 1; } to { transform: translate(var(--x), var(--y)); opacity: 0; } }
    .daun { animation: daun 5s linear infinite; }
    @keyframes daun { 0% { transform: translate(0,0) rotate(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(-60px, 190px) rotate(360deg); opacity: 0; } }
    .burung { animation: terbang 9s linear infinite; }
    @keyframes terbang { from { transform: translate(700px, 60px); } to { transform: translate(-80px, 20px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs><linearGradient id="langit5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ecae6"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient></defs>
  <rect width="640" height="360" fill="url(#langit5)"/>
  <g class="burung" stroke="#1f2937" stroke-width="2.5" fill="none"><path d="M0 0 q8 -8 16 0 q8 -8 16 0"/></g>
  <path d="M0 250 Q160 215 320 240 T640 230 V360 H0Z" fill="#6f9a43"/>
  <path d="M0 285 Q200 262 400 282 T640 278 V360 H0Z" fill="#a67c52"/>
  <g fill="#3f6b2a"><path d="M30 252 l24 -70 l24 70z"/><path d="M70 246 l30 -88 l30 88z"/><path d="M560 240 l28 -80 l28 80z"/><path d="M600 238 l22 -60 l22 60z"/></g>
  <!-- zona bahaya -->
  <g fill="#facc15"><rect x="460" y="316" width="170" height="6"/></g>
  <g fill="#ef4444"><rect x="458" y="300" width="5" height="26"/><rect x="626" y="300" width="5" height="26"/></g>
  <text x="545" y="342" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#7c2d12">ZONA BAHAYA</text>
  <!-- tunggul -->
  <rect x="390" y="270" width="22" height="16" fill="#8a5a2b"/>
  <!-- pohon yang ditebang -->
  <g class="pohon">
    <rect x="390" y="120" width="22" height="162" rx="4" fill="#7c4a22"/>
    <circle cx="401" cy="104" r="50" fill="#4d7c2f"/>
    <circle cx="370" cy="130" r="34" fill="#5f9138"/>
    <circle cx="434" cy="126" r="36" fill="#3f6b2a"/>
    <path class="daun" d="M420 120 q8 -6 14 0 q-6 8 -14 0z" fill="#65a30d"/>
    <path class="daun" d="M380 100 q8 -6 14 0 q-6 8 -14 0z" fill="#84cc16" style="animation-delay:2s"/>
  </g>
  <!-- serbuk kayu -->
  <g class="serbuk" fill="#d6a86a">
    <circle cx="392" cy="276" r="2.5" style="--x:-30px;--y:-18px"/>
    <circle cx="392" cy="276" r="2" style="--x:-40px;--y:4px;animation-delay:.2s"/>
    <circle cx="392" cy="276" r="2.5" style="--x:-22px;--y:-30px;animation-delay:.4s"/>
  </g>
  <!-- operator chainsaw -->
  <g>
    <circle cx="316" cy="214" r="13" fill="#f1c27d"/>
    <path d="M301 210 a15 13 0 0 1 30 0 z" fill="#f97316"/>
    <rect x="322" y="210" width="12" height="7" rx="2" fill="#0ea5e9" opacity=".8"/>
    <rect x="302" y="228" width="28" height="40" rx="6" fill="#f97316"/>
    <rect x="302" y="240" width="28" height="4" fill="#fde047"/>
    <rect x="304" y="266" width="11" height="22" fill="#1e3a8a"/><rect x="318" y="266" width="11" height="22" fill="#1e3a8a"/>
    <rect x="302" y="270" width="28" height="12" rx="3" fill="#f59e0b" opacity=".9"/>
    <g class="gergaji">
      <rect x="326" y="244" width="26" height="8" rx="4" fill="#f97316"/>
      <rect x="348" y="236" width="24" height="18" rx="4" fill="#dc2626"/>
      <rect x="368" y="248" width="30" height="7" rx="3.5" fill="#9ca3af"/>
    </g>
  </g>
  <!-- bulldozer -->
  <g transform="translate(120 250)">
    <rect x="30" y="0" width="84" height="36" rx="4" fill="#f59e0b"/>
    <rect x="66" y="-28" width="40" height="30" rx="3" fill="#f59e0b"/><rect x="72" y="-22" width="28" height="18" fill="#bae6fd"/>
    <rect x="22" y="34" width="100" height="20" rx="10" fill="#374151"/>
    <path d="M0 10 h14 v40 h-14 q-6 -20 0 -40z" fill="#9ca3af"/>
  </g>
</svg>
