<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Animasi pekerja di ketinggian dengan full body harness">
  <style>
    .awan { animation: geser 18s linear infinite; }
    .awan2 { animation: geser 26s linear infinite; animation-delay: -9s; }
    @keyframes geser { from { transform: translateX(-160px); } to { transform: translateX(700px); } }
    .ayun { transform-origin: 380px 40px; animation: ayun 4s ease-in-out infinite; }
    @keyframes ayun { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    .tangan { transform-origin: 402px 205px; animation: kerja 1.2s ease-in-out infinite; }
    @keyframes kerja { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-18deg); } }
    .kedip { animation: kedip 1.6s steps(1) infinite; }
    @keyframes kedip { 50% { opacity: .15; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="langit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4ec"/><stop offset="1" stop-color="#dff1fb"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#langit)"/>
  <g class="awan" fill="#fff" opacity=".9"><ellipse cx="60" cy="60" rx="46" ry="16"/><ellipse cx="90" cy="50" rx="30" ry="16"/></g>
  <g class="awan2" fill="#fff" opacity=".8"><ellipse cx="60" cy="110" rx="36" ry="12"/><ellipse cx="82" cy="102" rx="22" ry="12"/></g>
  <!-- gedung -->
  <rect x="440" y="20" width="200" height="340" fill="#cbd5e1"/>
  <rect x="440" y="20" width="12" height="340" fill="#94a3b8"/>
  <g fill="#7dd3fc" stroke="#64748b" stroke-width="3">
    <rect x="478" y="50" width="54" height="44"/><rect x="560" y="50" width="54" height="44"/>
    <rect x="478" y="130" width="54" height="44"/><rect x="560" y="130" width="54" height="44"/>
    <rect x="478" y="210" width="54" height="44"/><rect x="560" y="210" width="54" height="44"/>
  </g>
  <!-- titik tambat dan tali -->
  <rect x="360" y="16" width="100" height="10" fill="#475569"/>
  <circle cx="380" cy="30" r="7" fill="none" stroke="#1e293b" stroke-width="4"/>
  <g class="ayun">
    <line x1="380" y1="36" x2="380" y2="180" stroke="#ea580c" stroke-width="4"/>
    <line x1="386" y1="36" x2="392" y2="180" stroke="#7c3aed" stroke-width="3"/>
    <!-- pekerja -->
    <g>
      <circle cx="384" cy="164" r="15" fill="#f1c27d"/>
      <path d="M366 160 a18 16 0 0 1 36 0 z" fill="#dc2626"/>
      <rect x="392" y="154" width="8" height="5" rx="2" fill="#facc15" class="kedip"/>
      <rect x="368" y="180" width="34" height="52" rx="8" fill="#a3e635"/>
      <path d="M368 186 l34 36 M402 186 l-34 36" stroke="#f97316" stroke-width="5"/>
      <rect x="366" y="228" width="38" height="8" rx="3" fill="#f97316"/>
      <rect x="370" y="236" width="12" height="44" rx="4" fill="#1e3a8a"/>
      <rect x="388" y="236" width="12" height="44" rx="4" fill="#1e3a8a"/>
      <rect x="366" y="276" width="18" height="9" rx="3" fill="#111827"/>
      <rect x="386" y="276" width="18" height="9" rx="3" fill="#111827"/>
      <g class="tangan">
        <rect x="398" y="196" width="36" height="10" rx="5" fill="#a3e635"/>
        <circle cx="436" cy="201" r="7" fill="#f97316"/>
        <rect x="434" y="176" width="8" height="46" rx="2" fill="#facc15"/>
      </g>
    </g>
  </g>
  <!-- rambu di bawah -->
  <rect x="0" y="330" width="640" height="30" fill="#78716c"/>
  <g fill="#facc15"><rect x="40" y="306" width="120" height="10"/><rect x="200" y="306" width="120" height="10"/></g>
  <g fill="#111827"><rect x="60" y="306" width="20" height="10"/><rect x="100" y="306" width="20" height="10"/><rect x="220" y="306" width="20" height="10"/><rect x="260" y="306" width="20" height="10"/></g>
  <g fill="#ef4444"><rect x="36" y="300" width="6" height="30"/><rect x="158" y="300" width="6" height="30"/><rect x="196" y="300" width="6" height="30"/><rect x="318" y="300" width="6" height="30"/></g>
</svg>
