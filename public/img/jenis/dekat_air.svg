<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Animasi bekerja dekat air dengan pelampung dan ring buoy">
  <style>
    .ombak1 { animation: ombak 4s linear infinite; }
    .ombak2 { animation: ombak 6s linear infinite reverse; }
    @keyframes ombak { from { transform: translateX(0); } to { transform: translateX(-80px); } }
    .apung { animation: apung 2.6s ease-in-out infinite; }
    @keyframes apung { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
    .pompa { animation: getar .12s linear infinite alternate; }
    @keyframes getar { to { transform: translateY(-1.5px); } }
    .keluar path { stroke-dasharray: 10 8; animation: alir .8s linear infinite; }
    @keyframes alir { to { stroke-dashoffset: -18; } }
    .rambu { transform-origin: 112px 190px; animation: rambu 3s ease-in-out infinite; }
    @keyframes rambu { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="langit6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bde0fe"/><stop offset="1" stop-color="#f1f5f9"/></linearGradient>
    <linearGradient id="air6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f8a91"/><stop offset="1" stop-color="#2f5559"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#langit6)"/>
  <!-- tanggul -->
  <path d="M0 190 L260 190 L330 250 L330 360 L0 360Z" fill="#a0764a"/>
  <path d="M0 190 L260 190 L275 203 L0 203Z" fill="#c29663"/>
  <!-- sump -->
  <rect x="300" y="248" width="340" height="112" fill="url(#air6)"/>
  <g class="ombak1" stroke="#dbeafe" stroke-width="3" fill="none" opacity=".7">
    <path d="M300 270 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
    <path d="M300 320 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
  </g>
  <g class="ombak2" stroke="#e0f2fe" stroke-width="2" fill="none" opacity=".5">
    <path d="M260 295 q20 -6 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
  </g>
  <path d="M300 250 L330 250 L330 360 L300 360Z" fill="#a0764a"/>
  <!-- ring buoy mengapung -->
  <g class="apung" style="transform-origin:470px 262px">
    <circle cx="470" cy="262" r="18" fill="none" stroke="#f97316" stroke-width="10"/>
    <g stroke="#fff" stroke-width="10"><path d="M470 244 v6"/><path d="M470 274 v6"/><path d="M452 262 h6"/><path d="M482 262 h6"/></g>
  </g>
  <path d="M452 262 C400 230 330 220 300 214" stroke="#fde047" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
  <!-- pompa dewatering -->
  <g class="pompa"><rect x="336" y="226" width="54" height="28" rx="4" fill="#2563eb"/><rect x="344" y="232" width="18" height="10" fill="#bfdbfe"/></g>
  <path d="M390 240 h40" stroke="#374151" stroke-width="7"/>
  <g class="keluar" stroke="#1e3a8a" stroke-width="4" fill="none"><path d="M336 240 C300 238 280 222 260 206"/></g>
  <!-- barikade dan rambu -->
  <g fill="#ef4444"><rect x="176" y="150" width="6" height="42"/><rect x="236" y="150" width="6" height="42"/></g>
  <rect x="170" y="156" width="80" height="6" fill="#facc15"/><rect x="170" y="170" width="80" height="6" fill="#facc15"/>
  <g class="rambu">
    <rect x="110" y="120" width="4" height="72" fill="#6b7280"/>
    <path d="M112 96 l26 44 h-52z" fill="#facc15" stroke="#111827" stroke-width="3"/>
    <rect x="110" y="110" width="4" height="16" fill="#111827"/><rect x="110" y="130" width="4" height="4" fill="#111827"/>
  </g>
  <!-- dua pekerja dengan pelampung -->
  <g transform="translate(40 110)">
    <circle cx="20" cy="12" r="11" fill="#f1c27d"/><path d="M6 8 a14 12 0 0 1 28 0 z" fill="#fff"/>
    <rect x="6" y="24" width="28" height="36" rx="6" fill="#f97316"/><rect x="6" y="34" width="28" height="4" fill="#e5e7eb"/><rect x="6" y="46" width="28" height="4" fill="#e5e7eb"/>
    <rect x="10" y="60" width="9" height="20" fill="#1e3a8a"/><rect x="21" y="60" width="9" height="20" fill="#1e3a8a"/>
  </g>
  <g transform="translate(20 116)">
    <circle cx="0" cy="8" r="10" fill="#c68642"/><path d="M-13 4 a13 11 0 0 1 26 0 z" fill="#facc15"/>
    <rect x="-12" y="18" width="24" height="34" rx="6" fill="#f97316"/><rect x="-12" y="28" width="24" height="4" fill="#e5e7eb"/>
    <rect x="-9" y="52" width="8" height="22" fill="#1e3a8a"/><rect x="1" y="52" width="8" height="22" fill="#1e3a8a"/>
  </g>
</svg>
