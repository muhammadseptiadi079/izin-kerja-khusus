name: Tes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ikk
          POSTGRES_PASSWORD: ikk
          POSTGRES_DB: ikk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, gd, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pint --test
      - name: Pest (${{ matrix.database }})
        run: ./vendor/bin/pest
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ${{ matrix.database == 'pgsql' && 'ikk_test' || ':memory:' }}
          DB_USERNAME: ikk
          DB_PASSWORD: ikk
